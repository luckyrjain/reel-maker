name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install edge-tts ruff

      # Scoped to F/E9 (real bugs): the wider bugbear ruleset flags this repo's routine
      # FastAPI `Depends()`-in-default-argument idiom as B008, which isn't a real issue here.
      - name: Ruff
        run: ruff check --select F,E9 .

      - name: pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only — no push, no registry credentials needed. Catches a broken
      # Dockerfile (missing file in a COPY, a dependency that no longer installs
      # cleanly) on every push/PR instead of only being discovered at deploy time.
      - name: Build image
        run: docker build -t reel-maker:ci .

  golden-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install edge-tts

      # The one test marked `golden` (see pyproject.toml's marker registration) — real
      # edge-tts synthesis + real ffmpeg, no mocks. Excluded from the `test` job's
      # default run (it's slow and needs network on top of ffmpeg); runs here on its
      # own so a real render failure — the historical zero-audio-bug class this test
      # was written to catch — is caught same-day, not only found by a live operator run.
      - name: Golden-reel smoke test
        run: pytest -m golden -v
