[project]
name = "reel-maker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "moviepy>=2.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
tts = [
    "kokoro>=0.7",
]
captions = [
    "openai-whisper>=20231117",
]

[tool.pytest.ini_options]
markers = [
    "golden: end-to-end smoke test — real edge-tts synthesis + real ffmpeg render, no mocks. Slow (~20s, dominated by a real TTS network call) and needs network access, unlike the rest of the suite (which only needs ffmpeg on PATH, no network). Excluded from the default run by addopts below; see tests/test_golden_reel.py and .github/workflows/ci.yml's golden-reel job, which runs it explicitly.",
]
# Default run skips `golden` tests — every other slow/environment-dependent test in this
# suite (test_compositor.py's real-ffmpeg tests) only needs a binary on PATH and runs in
# well under a second; this one makes a real network call and adds ~20s to every routine
# `pytest -q` a developer runs locally. `pytest -m golden` (or CI's dedicated job) runs it
# explicitly instead.
addopts = "-m 'not golden'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "engine"]
